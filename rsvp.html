    <style>
        body {
            width: 100%;
            margin: 0 auto;
            justify-content: center;
        }

        button {
            font-family: Verdana;
            width: 200px;
            padding: 10px;
            background-color: #44AA99;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

            button:hover {
                background-color: #00AA99;
            }

        #venLogo {
            width: 300px;
            height: 300px;
            float: none;
            margin: 10px;
        }

            width: 60%;
            padding: 10px;
        }

        .profWindow {
            width: 0px; /* formerly 100% */
            min-height: 144px;
            padding: 20px;
            background-color: #CFFF45;
            border: 3px solid black;
            border-radius: 12px;
            vertical-align: top;
            float: none;
            display: none; /* remove this on the main site */
        }

        .venApp {
            text-decoration: none;
        }
        .venAppImg {
            width: 100px;
            height: 100px;
            padding: 0px 25px;
        }
        .apption { /* App Caption */
            color: black;
            max-width: 120px;
            padding: 0px 15px;
            text-align: center;
            font-family: verdana;
            font-size: 80%;
        }
            .apption:hover { /* App Caption */
                color: maroon;
            }
            .apption:active { /* App Caption */
                color: white;
            }

        footer {
            text-align: center;
            padding: 3px;
            background-color: #489000;
            color: white;
        }

        @media screen and (min-width: 600px) {
            body {
                width: 900px;
                margin: 0 auto;
            }

            #venLogo {
                width: 300px;
                margin: 10px;
            }

            #aboutBtn {
                width: 250px;
                padding: 10px;
            }

            .profWindow {
                width: 450px;
                height: 144px;
                padding: 20px;
                margin: 72px 0px;
                background-color: #CFFF45;
                border: 3px solid black;
                border-radius: 8px;
                vertical-align: top;
                float: right;
                display: inline-block;
            }
        }
    </style>
